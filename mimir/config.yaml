# https://developers.home-assistant.io/docs/add-ons/configuration
name: "Grafana Mimir"
version: "3.2.5-1"
slug: mimir
description: >-
  Grafana Mimir, long-term storage for Prometheus metrics. Monolithic mode
  with local filesystem storage. Thin wrapper on the official image.
url: https://github.com/charlestephen/hassio-apps/tree/main/mimir
stage: stable
homeassistant: "2026.6.0"
image: ghcr.io/charlestephen/hassio-addons-mimir-{arch}
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
apparmor: true
panel_icon: mdi:database-clock
watchdog: http://[HOST]:[PORT:9009]/ready
map:
  - type: data
    read_only: false
  - type: app_config
    read_only: false
ports:
  9009/tcp: 9009
ports_description:
  9009/tcp: Mimir HTTP API (remote write, query, /ready, /metrics)
backup: cold

options:
  log_level: info
  retention_period: "0"

schema:
  log_level: list(debug|info|warn|error)
  retention_period: match(^(0|[0-9]+[smhdwy])$)

