# https://developers.home-assistant.io/docs/add-ons/configuration
name: Traefik
version: "3.7.18-1"
slug: traefik
description: >-
  Modern HTTP reverse proxy and load balancer with file-based dynamic config
  and optional Let's Encrypt. Bundles Traefik for Home Assistant.
url: https://github.com/charlestephen/hassio-apps/tree/main/traefik
homeassistant: "2026.6.0"
stage: stable
image: ghcr.io/charlestephen/hassio-addons-traefik-{arch}
arch:
  - aarch64
  - amd64
startup: system
init: false
boot: auto
apparmor: true
hassio_role: default
hassio_api: true
auth_api: true
panel_icon: mdi:earth-arrow-right
ingress: true
ingress_entry: dashboard/
map:
  - type: app_config
    read_only: false
  # Legacy: one-shot migration of /homeassistant/traefik and addon_configs.
  - type: homeassistant_config
    read_only: false
  - type: all_app_configs
    read_only: false
  - type: share
    read_only: false
  - type: ssl
    read_only: false
ports:
  80/tcp: 80
  443/tcp: 443
  8080/tcp: 8080
ports_description:
  80/tcp: HTTP (web entrypoint)
  443/tcp: HTTPS (websecure entrypoint)
  8080/tcp: Traefik dashboard (also via Ingress)
backup: cold

options:
  log_level: ERROR
  access_logs: false
  forwarded_headers_insecure: false
  insecure_skip_verify: false
  # app_config is mounted at /config (host: addon_configs/<repo>_traefik/).
  dynamic_configuration_path: "/config/dynamic/"
  letsencrypt:
    enabled: false
    resolvers:
      - 1.1.1.1:53
    email: youremail@domain.com
    challenge_type: dnsChallenge
    provider: cloudflare
    delayBeforeCheck: 10
  custom_config:
    use_config_file: false
    config_file: "/config/traefik.yaml"
  env_vars: []
schema:
  log_level: list(TRACE|DEBUG|INFO|WARN|ERROR|FATAL|PANIC)
  access_logs: bool
  forwarded_headers_insecure: bool
  insecure_skip_verify: bool
  proxy_protocol_trusted_ips:
    - str?
  dynamic_configuration_path: str
  letsencrypt:
    enabled: bool
    email: email?
    challenge_type: match(tlsChallenge|httpChallenge|dnsChallenge)?
    provider: str?
    delayBeforeCheck: int?
    resolvers:
      - str?
  custom_config:
    use_config_file: bool
    config_file: str
  env_vars:
    - str
