---
# Thin wrapper on the official multi-arch speed test image (GHCR only).
build_from:
  aarch64: ghcr.io/ozark-connect/speedtest:2.11.1
  amd64: ghcr.io/ozark-connect/speedtest:2.11.1
upstream_repo: "Ozark-Connect/NetworkOptimizer"
upstream_build_from: true
upstream_version_arg: NETWORK_OPTIMIZER_SPEEDTEST_VERSION
args:
  NETWORK_OPTIMIZER_SPEEDTEST_VERSION: "2.11.1"
