name: Network Optimizer Speed Test
description: >-
  OpenSpeedTest frontend customized for Network Optimizer — posts results to
  the companion app. Thin wrapper on ghcr.io/ozark-connect/speedtest.
url: https://github.com/charlestephen/hassio-apps/tree/main/network-optimizer-speedtest
version: "2.11.0"
stage: stable
homeassistant: "2026.6.0"
slug: network_optimizer_speedtest
image: ghcr.io/charlestephen/hassio-apps/network-optimizer-speedtest-{arch}
init: false
startup: application
boot: auto
panel_icon: mdi:speedometer
webui: http://[HOST]:[PORT:3005]
arch:
  - aarch64
  - amd64
map:
  - type: data
    read_only: false
ports:
  3000/tcp: 3005
ports_description:
  3000/tcp: OpenSpeedTest web UI (host 3005 → container 3000)
backup: cold

# Same host / proxy variables as Network Optimizer so result POSTs and the
# canonical-URL redirect follow the URL you assign.
options:
  tz: America/New_York
  host_ip: ""
  host_name: ""
  reverse_proxied_host_name: ""
  reverse_proxied_port: ""
  trusted_proxies: ""
  trusted_proxy_hops: ""
  trust_cf_connecting_ip: false
  openspeedtest_port: "3005"
  openspeedtest_host: ""
  openspeedtest_https: false
  openspeedtest_https_port: "443"
  external_server_id: ""
  extra_env: ""
schema:
  tz: str
  host_ip: str?
  host_name: str?
  reverse_proxied_host_name: str?
  reverse_proxied_port: str?
  trusted_proxies: str?
  trusted_proxy_hops: str?
  trust_cf_connecting_ip: bool
  openspeedtest_port: str
  openspeedtest_host: str?
  openspeedtest_https: bool
  openspeedtest_https_port: str
  external_server_id: str?
  extra_env: str?
