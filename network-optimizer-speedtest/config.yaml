name: UniFi Network Optimizer Speedtest
description: Companion OpenSpeedTest server for the UniFi Network Optimizer app (WAN/LAN speed testing).
url: https://github.com/Ozark-Connect/NetworkOptimizer
version: "2.0.1-1"
slug: network-optimizer-speedtest
arch:
  - amd64
  - aarch64
image: ghcr.io/charlestephen/hassio-addons-network-optimizer-speedtest-{arch}
init: true                              # Fixed: enable tini for clean signal handling
startup: services
boot: auto
panel_icon: mdi:speedometer
webui: http://[HOST]:[PORT:3000]
ports:
  3000/tcp: 3005
ports_description:
  3000/tcp: Speedtest Web UI (host port 3005, matching the optimizer default)
backup: cold
stage: experimental                     # Added: HA store compatibility

# Full env surface from the upstream speedtest service (docker-compose.prod.yml).
options:
  timezone: "America/New_York"
  host_name: ""
  host_ip: ""
  openspeedtest_port: 3005
  openspeedtest_host: ""
  openspeedtest_https: false
  openspeedtest_https_port: 443
  reverse_proxied_host_name: ""

schema:
  timezone: str?
  host_name: str?
  host_ip: str?
  openspeedtest_port: int(1,65535)?
  openspeedtest_host: str?
  openspeedtest_https: bool
  openspeedtest_https_port: int(1,65535)?
  reverse_proxied_host_name: str?