---
# Thin wrapper on udp-mirror's official multi-arch image (GHCR: czerwonk/udp-mirror).
build_from:
  aarch64: ghcr.io/czerwonk/udp-mirror:0.1.1
  amd64: ghcr.io/czerwonk/udp-mirror:0.1.1
upstream_repo: "czerwonk/udp-mirror"
upstream_build_from: true
upstream_docker_image: "czerwonk/udp-mirror"
upstream_version_arg: UDP_MIRROR_VERSION
args:
  UDP_MIRROR_VERSION: "0.1.1"
