---
# udp-mirror's own image has no shell and an unresolvable ENTRYPOINT (see
# Dockerfile), so BUILD_FROM is the HA base image and only the compiled
# binary is taken from upstream. upstream_build_from is intentionally unset:
# bumping the udp-mirror version must not touch this BUILD_FROM pin.
build_from:
  aarch64: ghcr.io/hassio-addons/base:stable
  amd64: ghcr.io/hassio-addons/base:stable
upstream_repo: "czerwonk/udp-mirror"
upstream_docker_image: "czerwonk/udp-mirror"
upstream_version_arg: UDP_MIRROR_VERSION
args:
  UDP_MIRROR_VERSION: "0.1.1"
