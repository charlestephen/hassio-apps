name: UDP Mirror
description: udp-mirror listens for UDP packets and sends copies to multiple receivers, so more than one UDP-based analysis tool (e.g. a flow collector) can see the same traffic.
url: https://github.com/charlestephen/hassio-apps/tree/main/udp-mirror
version: "0.1.1-1"
stage: stable
homeassistant: "2026.6.0"
slug: udp-mirror
image: ghcr.io/charlestephen/hassio-addons-udp-mirror-{arch}
startup: application
init: false
boot: auto
hassio_role: default
panel_icon: mdi:call-split
arch:
  - aarch64
  - amd64
ports:
  4560/udp: 4560
ports_description:
  4560/udp: UDP packets to mirror
options:
  listen_address: ":4560"
  receivers:
    - "127.0.0.1:2055"
schema:
  listen_address: str
  receivers:
    - str
