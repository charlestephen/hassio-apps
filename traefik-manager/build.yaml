---
# Thin wrapper: build directly on the official multi-arch Traefik Manager
# image. Renovate tracks this tag via the shared regex manager.
build_from:
  aarch64: ghcr.io/chr0nzz/traefik-manager:$APP_NEW_VERSION
  amd64: ghcr.io/chr0nzz/traefik-manager:$APP_NEW_VERSION
upstream_repo: "chr0nzz/traefik-manager"
upstream_build_from: true
upstream_version_arg: TRAEFIK_MANAGER_VERSION
args:
  TRAEFIK_MANAGER_VERSION: "$APP_NEW_VERSION"
