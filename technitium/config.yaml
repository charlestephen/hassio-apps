name: Technitium DNS
description: Technitium DNS Server is an open source authoritative and recursive DNS server with a web-based management UI.
url: https://git.lan.cst.wtf/charlestephen/hassio-addons/src/branch/main/technitium
version: 15.4.0-1
stage: stable
homeassistant: "2026.6.0"
slug: technitium
image: ghcr.io/charlestephen/hassio-addons-technitium-{arch}
startup: services
init: false
boot: auto
auth_api: true
hassio_api: true
hassio_role: manager
discovery:
  - technitium
# host_network lets Technitium bind directly to host ports so it can serve as
# Home Assistant's built-in DNS resolver. Under host networking the `ports:`
# and `ports_description:` keys are ignored; the ports listed below are the
# host ports the app will listen on. Ensure each is free before starting:
#   53/tcp + 53/udp   - DNS (must be free; conflicts with any host resolver)
#   853/tcp           - DNS-over-TLS
#   853/udp           - DNS-over-QUIC (libmsquic)
#   443/tcp + 443/udp - DNS-over-HTTPS (DoH) and DNS-over-HTTPS/3 (libmsquic)
#   5380/tcp          - Web management UI (this is the webui: URL below)
#   53443/tcp         - Alternate DoH port
#   80/tcp + 8053/tcp - DoH-over-HTTP (use behind TLS-terminating reverse proxy)
#   67/udp            - DHCP server (optional)
host_network: true
ports:
  53/udp: 53
  853/tcp: null
  5380/tcp: null
# Supervisor renders [PORT:NNNN] as the actual published host port. Under
# host_network: true the port equals the listening port (no NAT remap), but
# the [PORT:NNNN] template is still required by Supervisor's webui validator.
webui: http://[HOST]:[PORT:5380]
panel_icon: mdi:dns
arch:
- aarch64
- amd64
map:
- type: data
  read_only: false
- type: ssl
  read_only: true
options:
  log_level: info
  web_service_local_addresses: "0.0.0.0"
  reset_webservice_config: false
  dns_server_domain: ""
  dns_server_admin_password: ""
  dns_server_prefer_ipv6: false
  dns_server_recursion: AllowOnlyForPrivateNetworks
  dns_server_forwarders: ""
  dns_server_forwarder_protocol: Udp
  dns_server_enable_blocking: true
  dns_server_block_list_urls: ""
  dns_server_optional_protocol_dns_over_http: false
  extra_env: []
schema:
  log_level: list(trace|debug|info|warning|error|fatal)
  web_service_local_addresses: str
  reset_webservice_config: bool
  dns_server_domain: str?
  dns_server_admin_password: password?
  dns_server_prefer_ipv6: bool?
  dns_server_recursion: list(Allow|Deny|AllowOnlyForPrivateNetworks|UseSpecifiedNetworkACL)?
  dns_server_forwarders: str?
  dns_server_forwarder_protocol: list(Udp|Tcp|Tls|Https|HttpsJson)?
  dns_server_enable_blocking: bool?
  dns_server_block_list_urls: str?
  dns_server_optional_protocol_dns_over_http: bool?
  extra_env:
    - match(^DNS_SERVER_[A-Z0-9_]+=.*$)
