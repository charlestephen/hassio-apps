---
# No Renovate-tracked base pin here: the Dockerfile's FROM is fixed at
# ghcr.io/home-assistant/base:3.24. The release version is passed through
# ALLOY_VERSION below and can be updated by the upstream tracking workflow.
build_from:
  aarch64: ghcr.io/home-assistant/base:3.24
  amd64: ghcr.io/home-assistant/base:3.24
upstream_repo: "grafana/alloy"
upstream_version_arg: ALLOY_VERSION
upstream_version_arg_prefix: v
args:
  ALLOY_VERSION: "$APP_NEW_VERSION"
