# https://developers.home-assistant.io/docs/add-ons/configuration
name: "VictoriaLogs"
version: "1.53.0-1"
slug: victoria_logs
description: >-
  VictoriaLogs, a lightweight log database. Accepts OTLP, Loki push,
  Elasticsearch and syslog-style ingestion. Thin wrapper on the official
  image.
url: https://github.com/charlestephen/hassio-apps/tree/main/victoria-logs
stage: stable
homeassistant: "2026.6.0"
image: ghcr.io/charlestephen/hassio-addons-victoria-logs-{arch}
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
apparmor: true
panel_icon: mdi:text-search
webui: http://[HOST]:[PORT:9428]/select/vmui/
watchdog: http://[HOST]:[PORT:9428]/health
map:
  - type: data
    read_only: false
  - type: app_config
    read_only: false
ports:
  9428/tcp: 9428
ports_description:
  9428/tcp: VictoriaLogs HTTP API (ingestion, query, /select/vmui, /metrics)
backup: cold

options:
  log_level: INFO
  retention_period: "30d"
  extra_args: ""

schema:
  log_level: list(INFO|WARN|ERROR|FATAL|PANIC)
  retention_period: match(^[0-9]+[hdwy]?$)
  extra_args: str?

