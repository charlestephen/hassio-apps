# https://developers.home-assistant.io/docs/add-ons/configuration
name: Pocket ID
description: >-
  OpenID Connect Certified™ and OAuth 2.0 provider with passkey-only sign-in.
  Thin wrapper on the official Pocket ID image.
url: https://github.com/charlestephen/hassio-apps/tree/main/pocket-id
version: "2.19.2-4"
stage: stable
homeassistant: "2026.6.0"
slug: pocket_id
image: ghcr.io/charlestephen/hassio-addons-pocket-id-{arch}
init: false
startup: application
boot: auto
apparmor: true
panel_icon: mdi:shield-key
webui: http://[HOST]:[PORT:1411]
arch:
  - aarch64
  - amd64
map:
  - type: data
    read_only: false
  - type: ssl
    read_only: true
ports:
  1411/tcp: 1411
ports_description:
  1411/tcp: Pocket ID web UI and OIDC endpoints
backup: cold

# Essentials + SMTP. LDAP / OTEL / extras → env_vars.
# https://pocket-id.org/docs/configuration/environment-variables
options:
  app_url: ""
  encryption_key: ""
  trust_proxy: "false"
  trusted_platform: ""
  internal_app_url: ""
  maxmind_license_key: ""
  puid: 0
  pgid: 0
  port: 1411
  log_level: info
  analytics_disabled: false
  version_check_disabled: false
  db_connection_string: ""
  # Pocket ID only reads SMTP_* (and other app-config) from the environment when
  # UI_CONFIG_DISABLED is set. Turning this on (or filling any SMTP field) locks
  # Settings in the Pocket ID UI for those values — manage them here / via env_vars.
  ui_config_disabled: false
  smtp_host: ""
  smtp_port: ""
  smtp_from: ""
  smtp_user: ""
  smtp_password: ""
  smtp_tls: none
  smtp_skip_cert_verify: false
  env_vars: []
schema:
  # Required at runtime (wrapper exits if empty). Schema stays optional so
  # Supervisor can install with defaults, then the entrypoint fails clearly.
  app_url: str?
  encryption_key: password?
  trust_proxy: str
  trusted_platform: str?
  internal_app_url: str?
  maxmind_license_key: password?
  puid: int(0,)
  pgid: int(0,)
  port: port
  log_level: list(debug|info|warn|error)
  analytics_disabled: bool
  version_check_disabled: bool
  db_connection_string: str?
  ui_config_disabled: bool
  smtp_host: str?
  smtp_port: str?
  smtp_from: str?
  smtp_user: str?
  smtp_password: password?
  smtp_tls: list(none|starttls|tls)
  smtp_skip_cert_verify: bool
  env_vars:
    - name: str
      value: password?
      secret: bool?
