---
configuration:
  app_url:
    name: App URL
    description: >-
      Public URL browsers open Pocket ID at (e.g. https://id.example.com), with
      no path and no trailing slash. Passkeys are bound to this domain. Leave
      empty only for local bring-up (defaults to http://localhost:1411).
  encryption_key:
    name: Encryption key
    description: >-
      At least 16 bytes; encrypts token signing keys. Leave blank to auto-generate
      a stable key on first start (stored under /data/.encryption_key).
  trust_proxy:
    name: Trust proxy
    description: >-
      false (default), true (trust every peer — only if unreachable except via
      your proxy), or a comma-separated list of proxy IPs/CIDRs for X-Forwarded-For.
  trusted_platform:
    name: Trusted platform header
    description: >-
      Optional client-IP header from a CDN (e.g. CF-Connecting-IP). Prefer this
      over listing CDN ranges in Trust proxy.
  internal_app_url:
    name: Internal App URL
    description: >-
      Optional base URL other containers use for token / PAR / JWKS discovery
      when they cannot reach App URL (e.g. http://pocket-id:1411). Leave empty
      to use App URL. No trailing slash.
  maxmind_license_key:
    name: MaxMind license key
    description: Free MaxMind key so Pocket ID can download GeoLite2 for audit locations.
  puid:
    name: PUID
    description: >-
      Unix UID Pocket ID runs as. 0 = root (skips upstream addgroup; recommended
      default on HA). Non-zero uses upstream entrypoint user setup.
  pgid:
    name: PGID
    description: Unix GID Pocket ID runs as. 0 = root (pair with PUID 0).
  port:
    name: Listen port
    description: TCP port inside the container (default 1411). Match the Network mapping.
  log_level:
    name: Log level
    description: "Verbosity: debug, info, warn or error."
  analytics_disabled:
    name: Disable analytics
    description: Turn off the daily heartbeat that counts running instances.
  version_check_disabled:
    name: Disable version check
    description: Turn off the check for new releases on GitHub.
  db_connection_string:
    name: Database connection string
    description: >-
      Leave empty for SQLite under /data. Or a postgres:// URL for PostgreSQL.
  ui_config_disabled:
    name: Disable UI configuration
    description: >-
      When on, Pocket ID reads application settings (including SMTP) from the
      environment instead of Settings in the web UI. Automatically enabled if
      any SMTP field below is set.
  smtp_host:
    name: SMTP host
    description: Mail server hostname (SMTP_HOST).
  smtp_port:
    name: SMTP port
    description: Mail server port as a string, e.g. 587 or 465 (SMTP_PORT).
  smtp_from:
    name: SMTP from address
    description: Envelope/from address (SMTP_FROM).
  smtp_user:
    name: SMTP username
    description: SMTP auth user (SMTP_USER). Leave empty if the server needs none.
  smtp_password:
    name: SMTP password
    description: SMTP auth password (SMTP_PASSWORD).
  smtp_tls:
    name: SMTP TLS mode
    description: "none, starttls, or tls (SMTP_TLS). Use starttls for port 587."
  smtp_skip_cert_verify:
    name: SMTP skip certificate verify
    description: Skip TLS certificate verification for the mail server (insecure).
  env_vars:
    name: Extra environment variables
    description: >-
      Arbitrary Pocket ID variables (LDAP_*, EMAIL_*, UI overrides, OTEL_*, …).
      Mark secrets with secret: true so values stay out of logs.
network:
  1411/tcp: Pocket ID web UI and OIDC endpoints.
