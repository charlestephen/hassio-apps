---
# No Renovate-tracked base pin here: the Dockerfile's FROM is fixed at
# ghcr.io/home-assistant/base:3.24. The upstream version is passed through
# CLOUDFLARED_VERSION below and updated by the upstream tracking workflow.
build_from:
  aarch64: ghcr.io/home-assistant/base:3.24
  amd64: ghcr.io/home-assistant/base:3.24
upstream_repo: "cloudflare/cloudflared"
upstream_version_arg: CLOUDFLARED_VERSION
args:
  CLOUDFLARED_VERSION: "$APP_NEW_VERSION"
