# https://developers.home-assistant.io/docs/add-ons/configuration
name: "Authentik"
version: "2026.8.5-1"
slug: authentik
description: >-
  Open-source identity provider (OpenID Connect, OAuth 2.0, SAML, LDAP).
  Thin wrapper on the official image, running server and worker in one process.
url: https://github.com/charlestephen/hassio-apps/tree/main/authentik
image: ghcr.io/charlestephen/hassio-addons-authentik-{arch}
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
apparmor: true
panel_icon: mdi:shield-account
webui: http://[HOST]:[PORT:9000]/
watchdog: http://[HOST]:[PORT:9000]/-/health/live/
ports:
  9000/tcp: 9000
  9443/tcp: 9443
ports_description:
  9000/tcp: Authentik web UI and OIDC endpoints (HTTP)
  9443/tcp: Authentik web UI and OIDC endpoints (HTTPS, self-signed)
backup: cold

options:
  db_host: dd815a57-postgres
  db_port: 5432
  db_name: authentik
  db_user: authentik
  db_password: ""
  db_admin_user: postgres
  db_admin_password: ""
  secret_key: ""
  bootstrap_email: ""
  bootstrap_password: ""
  log_level: info
  env_vars: []
schema:
  db_host: str
  db_port: port
  db_name: str
  db_user: str
  db_password: password
  db_admin_user: str?
  db_admin_password: password?
  secret_key: password?
  bootstrap_email: email?
  bootstrap_password: password?
  log_level: list(trace|debug|info|warning|error)
  env_vars:
    - name: str
      value: password?
      secret: bool?
