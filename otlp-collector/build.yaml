---
# Binary is COPY'd from the official contrib image (FROM scratch) onto the HA base.
build_from:
  aarch64: ghcr.io/hassio-addons/base:stable
  amd64: ghcr.io/hassio-addons/base:stable
upstream_repo: "open-telemetry/opentelemetry-collector-contrib"
upstream_docker_image: "otel/opentelemetry-collector-contrib"
upstream_version_arg: OTELCOL_VERSION
args:
  OTELCOL_VERSION: "0.164.0"
