---
# Binary is COPY'd from the official contrib image (FROM scratch) onto Alpine.
# Thin wrap: jq + ca-certificates + ha-entrypoint (no s6/bashio).
build_from:
  aarch64: docker.io/library/alpine:3.24
  amd64: docker.io/library/alpine:3.24
upstream_repo: "open-telemetry/opentelemetry-collector-contrib"
upstream_docker_image: "otel/opentelemetry-collector-contrib"
upstream_version_arg: OTELCOL_VERSION
args:
  OTELCOL_VERSION: "0.165.0"
