configuration:
  log_level:
    name: Log level
    description: Collector process log verbosity (debug, info, warn, error).
  openobserve_url:
    name: OpenObserve URL
    description: >-
      Base URL of the OpenObserve app (default: this repository's OpenObserve
      app). Traces, metrics, and logs all go here unless an OTLP endpoint
      below is set for that signal. Needs username and password below too.
  openobserve_organization:
    name: OpenObserve organization
    description: Organization to ingest into. "default" unless you created another.
  openobserve_username:
    name: OpenObserve username
    description: Login email for the OpenObserve account used for ingestion (Basic auth).
  openobserve_password:
    name: OpenObserve password
    description: Password for that account. Required together with the username above.
  openobserve_stream:
    name: OpenObserve stream name (optional)
    description: >-
      Custom stream name for ingested data. Leave empty to use OpenObserve's
      own "default" stream.
  otlp_endpoint:
    name: OTLP endpoint (advanced / other backends)
    description: >-
      Shared OTLP/HTTP base URL for traces, metrics, and logs (e.g. Mimir's
      OTLP endpoint, another collector). Overrides OpenObserve for every
      signal when set. Per-signal fields below override this when set.
  otlp_traces_endpoint:
    name: OTLP traces endpoint (override)
    description: Optional; overrides OpenObserve/OTLP endpoint for traces only.
  otlp_metrics_endpoint:
    name: OTLP metrics endpoint (override)
    description: >-
      Optional; overrides OpenObserve/OTLP endpoint for metrics only (e.g.
      Mimir's or VictoriaMetrics' native OTLP endpoint).
  otlp_logs_endpoint:
    name: OTLP logs endpoint (override)
    description: Optional; overrides OpenObserve/OTLP endpoint for logs only.
  prometheus_remote_write_endpoint:
    name: Prometheus remote_write endpoint
    description: >-
      Optional full remote_write URL (VictoriaMetrics / Mimir) in addition to
      whatever is exporting metrics above. Leave empty to skip.
  enable_docker_stats:
    name: Enable Docker stats
    description: >-
      Collect container CPU, memory and network metrics through the Docker
      Socket Proxy app. Skipped with a warning when the proxy is not reachable.
  docker_host:
    name: Docker host
    description: >-
      Docker API endpoint used for Docker stats. The default is the Docker
      Socket Proxy app in this repository, which must have its Containers
      option turned on.
  scrape_homeassistant:
    name: Scrape Home Assistant Prometheus
    description: >-
      Scrape homeassistant:<port>/api/prometheus (enable under Settings → System
      → Analytics). Use a long-lived access token below if the endpoint requires auth.
  ha_port:
    name: Home Assistant port
    description: >-
      Port Home Assistant serves on, used for the Prometheus scrape. Default 80;
      use 8123 if Home Assistant has not been moved to port 80.
  ha_prometheus_token:
    name: Home Assistant access token
    description: >-
      Long-lived access token for the Prometheus scrape (Bearer). Leave empty
      only if the endpoint allows unauthenticated scrapes.
  prometheus_scrape_targets:
    name: Extra Prometheus scrape targets
    description: >-
      Optional comma-separated host:port (or URL) list to scrape in addition to
      Home Assistant.
  config_yaml:
    name: Full collector YAML (optional)
    description: >-
      Paste a complete OpenTelemetry Collector config to replace the generated
      default entirely. Leave empty to use the built-in Home Assistant / Docker
      pipeline.
network:
  4317/tcp: OTLP gRPC (apps push here)
  4318/tcp: OTLP HTTP (apps push here)
  8888/tcp: Collector Prometheus metrics
