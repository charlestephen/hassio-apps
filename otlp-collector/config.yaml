name: OTLP Collector
description: >-
  OpenTelemetry Collector Contrib — collect Home Assistant / Docker metrics and
  receive OTLP logs, traces, and metrics; export to an endpoint you choose.
url: https://github.com/charlestephen/hassio-apps/tree/main/otlp-collector
version: "0.165.0-4"
stage: stable
homeassistant: "2026.6.0"
slug: otlp_collector
image: ghcr.io/charlestephen/hassio-addons-otlp-collector-{arch}
init: false
startup: services
boot: auto
panel_icon: mdi:chart-timeline-variant
arch:
  - aarch64
  - amd64
# docker_stats needs the host Docker socket; Supervisor only mounts it when
# Protection mode is off (see DOCS.md).
docker_api: true
hassio_api: true
apparmor: true
map:
  - type: data
    read_only: false
ports:
  4317/tcp: 4317
  4318/tcp: 4318
  8888/tcp: 8888
ports_description:
  4317/tcp: OTLP gRPC (apps push here)
  4318/tcp: OTLP HTTP (apps push here)
  8888/tcp: Collector internal Prometheus metrics
backup: cold

options:
  log_level: info
  # One OTLP/HTTP base URL for traces + metrics + logs (e.g.
  # http://otel-backend.example.com:4318). Leave empty only for bring-up
  # (debug exporter) or when using config_yaml / per-signal URLs.
  otlp_endpoint: ""
  # Optional per-signal overrides (win over otlp_endpoint when set).
  otlp_traces_endpoint: ""
  otlp_metrics_endpoint: ""
  otlp_logs_endpoint: ""
  # Optional Prometheus remote_write (VictoriaMetrics / Mimir) in addition to OTLP metrics.
  prometheus_remote_write_endpoint: ""
  enable_docker_stats: true
  # Scrape Home Assistant's Prometheus endpoint (Settings → System → Analytics).
  scrape_homeassistant: true
  ha_prometheus_token: ""
  # Extra comma-separated scrape targets (host:port or URL).
  prometheus_scrape_targets: ""
  # Paste a complete collector YAML to replace the generated default entirely.
  config_yaml: ""
schema:
  log_level: list(debug|info|warn|error)
  otlp_endpoint: str?
  otlp_traces_endpoint: str?
  otlp_metrics_endpoint: str?
  otlp_logs_endpoint: str?
  prometheus_remote_write_endpoint: str?
  enable_docker_stats: bool
  scrape_homeassistant: bool
  ha_prometheus_token: password?
  prometheus_scrape_targets: str?
  config_yaml: str?
