# https://developers.home-assistant.io/docs/add-ons/configuration
name: Homebridge
description: >-
  HomeKit bridge for non-HomeKit devices. Thin wrapper on the official
  homebridge/homebridge image (host networking required for discovery).
url: https://github.com/charlestephen/hassio-apps/tree/main/homebridge
version: "2026-11-02-3"
stage: stable
homeassistant: "2026.6.0"
slug: homebridge
image: ghcr.io/charlestephen/hassio-addons-homebridge-{arch}
# Upstream image already runs s6-overlay (/init).
init: false
startup: application
boot: auto
apparmor: true
# Host Avahi/mDNS via D-Bus (do not run a second Avahi in the container).
host_dbus: true
panel_icon: mdi:home-automation
# Use https when https_cert_file / https_key_file are set; otherwise http.
webui: https://[HOST]:[PORT:8581]
arch:
  - aarch64
  - amd64
# Upstream Docker guide requires host networking for HomeKit / mDNS.
host_network: true
map:
  # Same mount point as upstream Docker (-v …:/homebridge). No bind-mount.
  - type: data
    path: /homebridge
  - type: ssl
    read_only: true
# With host_network these document the UI port; the host listens directly.
ports:
  8581/tcp: 8581
ports_description:
  8581/tcp: Homebridge Config UI
backup: cold
# Keep Supervisor options out of Homebridge UI backup noise if copied.
backup_exclude:
  - options.json

options:
  tz: "America/New_York"
  # Off by default: host_network already sees the host mDNS stack. Enabling
  # in-container Avahi causes "another mdns processor on the same host".
  enable_avahi: false
  # Paths inside the container (Supervisor mounts HA /ssl here). Both required
  # to turn on Config UI HTTPS before first boot.
  https_cert_file: ""
  https_key_file: ""
  env_vars: []
schema:
  tz: str
  enable_avahi: bool
  https_cert_file: str?
  https_key_file: str?
  env_vars:
    - name: str
      value: password?
      secret: bool?
