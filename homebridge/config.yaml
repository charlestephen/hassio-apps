# https://developers.home-assistant.io/docs/add-ons/configuration
name: Homebridge
description: >-
  HomeKit bridge for non-HomeKit devices. Thin wrapper on the official
  homebridge/homebridge image (host networking required for discovery).
url: https://github.com/charlestephen/hassio-apps/tree/main/homebridge
version: "2026-11-02"
stage: stable
homeassistant: "2026.6.0"
slug: homebridge
image: ghcr.io/charlestephen/hassio-addons-homebridge-{arch}
# Upstream image already runs s6-overlay (/init).
init: false
startup: application
boot: auto
apparmor: true
panel_icon: mdi:home-automation
webui: http://[HOST]:[PORT:8581]
arch:
  - aarch64
  - amd64
# Upstream Docker guide requires host networking for HomeKit / mDNS.
host_network: true
map:
  - type: data
    read_only: false
# With host_network these document the UI port; the host listens directly.
ports:
  8581/tcp: 8581
ports_description:
  8581/tcp: Homebridge Config UI
backup: cold

options:
  tz: "America/New_York"
  # Upstream default is 1. Set 0 if the host already runs Avahi and you see
  # mDNS conflicts (then prefer host Avahi; see DOCS.md).
  enable_avahi: true
  env_vars: []
schema:
  tz: str
  enable_avahi: bool
  env_vars:
    - name: str
      value: password?
      secret: bool?
