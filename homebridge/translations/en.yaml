---
configuration:
  tz:
    name: Timezone
    description: Container timezone (e.g. America/New_York).
  enable_avahi:
    name: Enable in-container Avahi
    description: >-
      Leave off (default). This app uses host networking and host D-Bus, so
      HomeKit discovery should use the host mDNS/Avahi service. Turning this
      on starts a second Avahi and usually logs "another mdns processor on the
      same host".
  https:
    name: HTTPS for Open Web UI
    description: >-
      Set true when Config UI TLS is enabled so the Open Web UI button uses
      https://.
  https_cert_file:
    name: HTTPS certificate file
    description: >-
      Full-chain PEM under /ssl (e.g. /ssl/fullchain.pem). Set together with
      the key to enable Config UI HTTPS on first boot.
  https_key_file:
    name: HTTPS private key file
    description: >-
      Private key PEM under /ssl (e.g. /ssl/privkey.pem). Set together with
      the certificate.
  env_vars:
    name: Extra environment variables
    description: >-
      Optional extra variables for the Homebridge container. Mark secrets with
      secret: true.
network:
  8581/tcp: Homebridge Config UI (host networking — published on the HA host).
