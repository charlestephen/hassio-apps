name: ClickHouse
description: ClickHouse is a columnar OLAP database, used here as flow/time-series storage for other apps (e.g. Akvorado).
url: https://github.com/charlestephen/hassio-apps/tree/main/clickhouse
version: "26.8.40.7"
stage: stable
homeassistant: "2026.6.0"
slug: clickhouse
image: ghcr.io/charlestephen/hassio-addons-clickhouse-{arch}
startup: system
init: false
boot: auto
hassio_role: default
panel_icon: mdi:database-search
arch:
  - aarch64
  - amd64
map:
  - type: data
    read_only: false
ports:
  8123/tcp: 8123
  9000/tcp: 9100
ports_description:
  8123/tcp: HTTP interface (query, /ping)
  9000/tcp: Native protocol (clickhouse-client)
options:
  default_user_password: ""
  max_server_memory_usage_to_ram_ratio: 0.8
  log_level: information
schema:
  default_user_password: password?
  max_server_memory_usage_to_ram_ratio: float(0.1,1.0)
  log_level: list(trace|debug|information|warning|error)
