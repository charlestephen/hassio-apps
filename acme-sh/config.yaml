# https://developers.home-assistant.io/docs/add-ons/configuration
name: "Acme.sh"
version: "1.0.6"
slug: "acme-sh"
description: "Issue and renew certificates with acme.sh, then run deploy hooks"
url: "https://github.com/charlestephen/hassio-apps/tree/main/acme-sh"
image: "ghcr.io/charlestephen/hassio-addons-acme-sh-{arch}"
arch:
  - amd64
  - aarch64
init: false
startup: services
boot: auto
panel_icon: "mdi:certificate"
# Standalone HTTP-01 binds port 80 on the host. DNS-01 and webroot work on
# this network mode as well.
host_network: true
map:
  - type: ssl
    read_only: false
  - type: app_config
    read_only: false
  # Legacy host dir for one-shot migrate → /config then delete.
  - type: all_addon_configs
    read_only: false
  - type: share
    read_only: false
options:
  email: ""
  ca: letsencrypt
  acme_server: ""
  certificates: []
  env_vars: []
schema:
  email: str
  ca: list(letsencrypt|letsencrypt_test|zerossl|custom)
  # ACME directory URL (or acme.sh short name) when ca is custom — e.g. an
  # ACME proxy, Step CA, or other provider: https://acme.example/directory
  acme_server: str?
  certificates:
    - domain: str
      alt_domains: str?
      challenge: list(dns|standalone|webroot|dns_persist)
      dns_hook: str?
      dns_sleep: int(0,)?
      certificate_profile: str?
      renewal_days: int(0,)?
      webroot: str?
      deploy_hooks: str?
      reload_cmd: str?
      home_assistant: bool?
  env_vars:
    - name: str
      # password masks the value in the config screen (eye toggles reveal).
      value: password?
      secret: bool?
