---
# Multi-stage: upstream scratch binary copied onto the HA Alpine base (s6 + bashio).
build_from:
  aarch64: ghcr.io/hassio-addons/base:stable
  amd64: ghcr.io/hassio-addons/base:stable
upstream_repo: "charlestephen/dns-ip-list-chunker"
upstream_version_arg: DNS_IP_LIST_CHUNKER_VERSION
args:
  DNS_IP_LIST_CHUNKER_VERSION: "1.3.0"
