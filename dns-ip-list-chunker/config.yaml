# https://developers.home-assistant.io/docs/add-ons/configuration
name: "DNS/IP List Chunker"
version: "1.3.1"
slug: "dns_ip_list_chunker"
description: "Merge DNS/IP blocklists (and optional allowlists), then serve sized plain-text chunks for DNS servers and routers"
url: "https://github.com/charlestephen/hassio-apps/tree/main/dns-ip-list-chunker"
# Image name follows the app directory (hyphens), matching build.yml:
#   ghcr.io/<owner>/hassio-addons-<dir>-{arch}
image: "ghcr.io/charlestephen/hassio-addons-dns-ip-list-chunker-{arch}"
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
stage: stable
panel_icon: mdi:shield-search
webui: http://[HOST]:[PORT:8080]/

map:
  - type: data
    read_only: false

ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: "Chunk index, block/allow lists, /stats, /search, and /manage UI"

options:
  blocklist_urls:
    - "threat:https://example.com/threat-blocklist.txt"
    - "dns-blocklisting:https://example.com/dns-blocklist.txt"
  chunk_size: 100000
  refresh_interval: "6h"
  base_url: ""
  admin_token: ""
  exclusions_urls: []
  custom_blocklists: []
  exclusion_lists: []
schema:
  # str (not url): allows optional category tags like threat:https://…
  blocklist_urls:
    - str
  chunk_size: int(1,)
  refresh_interval: str
  base_url: str?
  admin_token: password?
  exclusions_urls:
    - url
  custom_blocklists:
    - name: str
      category: str?
      entries: str
  exclusion_lists:
    - name: str
      category: str?
      entries: str
      output_allowlist: bool?
