configuration:
  blocklist_urls:
    name: Blocklist URLs
    description: >-
      Upstream list URLs (txt, JSON, YAML, TOML, CSV). Optional category tag,
      e.g. threat:https://example.com/list.txt.
  chunk_size:
    name: Chunk size
    description: Maximum entries per served chunk file.
  refresh_interval:
    name: Refresh interval
    description: Go duration between re-fetches (e.g. 6h). Use 0 to disable.
  base_url:
    name: Public base URL
    description: Origin for generated chunk links. Leave empty behind a reverse proxy.
  admin_token:
    name: Admin token
    description: Password for /manage and the exclusion API.
  exclusions_urls:
    name: Exclusion list URLs
    description: Remote lists of domains/IPs to exclude from block feeds.
  custom_blocklists:
    name: Custom blocklists
    description: >-
      Inline named lists. Paste domains, IPs, or CIDRs one per line in entries.
      Optional category for /lists/<category>/… feeds.
  exclusion_lists:
    name: Exclusion / allow lists
    description: >-
      Inline named lists withheld from block feeds. Enable output_allowlist to
      publish /allowlists/<category>/… for DNS/router allowlist subscriptions.
network:
  8080/tcp: Chunk lists, stats, search, and management UI
