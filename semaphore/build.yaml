---
# https://github.com/hassio-addons/addon-base
build_from:
  aarch64: ghcr.io/hassio-addons/base:stable
  amd64: ghcr.io/hassio-addons/base:stable
upstream_repo: "semaphoreui/semaphore"
# Dockerfile FROM uses this Hub image at the GitHub release tag (vX.Y.Z).
# track-upstream skips releases that have no matching Hub tag yet.
upstream_docker_image: "semaphoreui/semaphore"
upstream_version_arg: SEMAPHORE_VERSION
args:
  SEMAPHORE_VERSION: "2.20.24"
  TERRAFORM_VERSION: "1.17.1"
  OPENTOFU_VERSION: "1.13.9"
