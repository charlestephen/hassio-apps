configuration:
  superuser_password:
    name: Superuser password
    description: Password of the postgres superuser. Change it from the default before starting.
  database:
    name: Database
    description: Name of a database to create when the cluster is first created. Kept for existing installs; use Databases instead.
  databases:
    name: Databases
    description: Databases to create on every start if they are missing.
  logins:
    name: Logins
    description: >-
      Logins to create or update on every start. The password is set to the value
      given here.
  rights:
    name: Rights
    description: >-
      Gives a login full access to a database. Both must exist, from the lists
      above or from before.
  data_directory:
    name: Data directory
    description: >-
      Optional. The folder inside /media where an external drive is mounted, for
      example /media/pgdata. The database is kept in a postgres subfolder of it.
      Tested only on Home Assistant Supervised. Leave empty to use the app's own
      storage.
  migrate_existing_data:
    name: Migrate existing data
    description: >-
      Turn on once when you set a Data directory and already have a database in
      the app's own storage. The data is copied and verified; the original is
      left in place. Safe to leave on.
  max_connections:
    name: Maximum connections
    description: Maximum number of concurrent client connections.
  log_level:
    name: Log level
    description: Verbosity of the app log.
network:
  5432/tcp: PostgreSQL
