name: pgAdmin
description: pgAdmin 4 — web-based management UI for PostgreSQL.
url: https://github.com/charlestephen/hassio-apps/tree/main/pgadmin
version: "9.19-6"
stage: stable
homeassistant: "2026.6.0"
slug: pgadmin
image: ghcr.io/charlestephen/hassio-addons-pgadmin-{arch}
startup: services
init: false
boot: auto
hassio_role: default
panel_icon: mdi:database-eye
webui: http://[HOST]:[PORT:5050]/
arch:
  - aarch64
  - amd64
map:
  - type: data
    read_only: false
  - type: app_config
    read_only: false
  # Legacy host dir for one-shot migrate → /config then delete.
  - type: all_addon_configs
    read_only: false
ports:
  5050/tcp: 5050
ports_description:
  5050/tcp: pgAdmin web UI
options:
  email: admin@example.com
  password: changeme
  log_level: info
  config: ""
  # --- OAuth2 / OIDC (written into generated config_local.py) ---
  oauth2_enabled: false
  oauth2_name: oidc
  oauth2_display_name: "Login with SSO"
  oauth2_client_id: ""
  oauth2_client_secret: ""
  oauth2_server_metadata_url: ""
  oauth2_scope: "openid email profile"
  oauth2_icon: "fa-openid"
  oauth2_button_color: "#3253a8"
  oauth2_auto_create_user: true
  authentication_sources: ""
  # Extra config_local.py assignments (name = Python identifier).
  config_vars: []
  register_postgres: true
  register_pgbouncer: false
  postgres_host: ""
  postgres_port: 5432
  postgres_user: postgres
  postgres_password: changeme
  postgres_db: homeassistant
schema:
  email: email
  password: password
  log_level: list(trace|debug|info|warning|error|fatal)
  config: str?
  oauth2_enabled: bool
  oauth2_name: str?
  oauth2_display_name: str?
  oauth2_client_id: str?
  oauth2_client_secret: password?
  oauth2_server_metadata_url: str?
  oauth2_scope: str?
  oauth2_icon: str?
  oauth2_button_color: str?
  oauth2_auto_create_user: bool
  authentication_sources: str?
  config_vars:
    - name: str
      value: password?
      secret: bool?
  register_postgres: bool
  register_pgbouncer: bool
  postgres_host: str?
  postgres_port: port?
  postgres_user: str?
  postgres_password: password?
  postgres_db: str?
