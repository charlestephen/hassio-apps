# https://developers.home-assistant.io/docs/add-ons/configuration
name: Ultimate CA Manager
description: >-
  Self-hosted Certificate Authority with ACME, SCEP, EST, OCSP, CRL, TSA, and
  SSH CA. Thin wrapper on neyslim/ultimate-ca-manager.
url: https://github.com/charlestephen/hassio-apps/tree/main/ultimate-ca-manager
version: "2.249-3"
stage: stable
homeassistant: "2026.6.0"
slug: ultimate-ca-manager
image: ghcr.io/charlestephen/hassio-addons-ultimate-ca-manager-{arch}
init: false
startup: system
boot: auto
# Profile name in apparmor.txt must match slug exactly (hyphens included).
apparmor: true
# Bind-mount /ssl/ucm over upstream Docker VOLUMEs at /opt/ucm/data and /etc/ucm.
privileged:
  - SYS_ADMIN
panel_icon: mdi:shield-lock
webui: https://[HOST]:[PORT:8443]
arch:
  - aarch64
  - amd64
map:
  - type: ssl
    read_only: false
  - type: data
    read_only: false
ports:
  8443/tcp: 8443
  8080/tcp: 8080
  8053/tcp: null
  8053/udp: null
ports_description:
  8443/tcp: HTTPS web UI and management API
  8080/tcp: HTTP protocol endpoints (CRL/CDP, OCSP, ACME HTTP-01)
  8053/tcp: Optional ACME DNS UPDATE (RFC 2136) TCP — internal only
  8053/udp: Optional ACME DNS UPDATE (RFC 2136) UDP — internal only
backup: cold

# Upstream docker-compose + admin/proxy env knobs. SMTP/ACME/SSO live in the UI.
# Extra vars go through env_vars — see upstream docs/installation/docker.md
options:
  ucm_fqdn: ""
  https_cert_file: ""
  https_key_file: ""
  https_port: 8443
  http_port: 8080
  debug: false
  log_level: INFO
  log_max_bytes: 10485760
  log_backups: 5
  secret_key: ""
  key_encryption_key: ""
  database_url: ""
  backup_enabled: true
  backup_retention_days: 30
  behind_proxy: false
  trusted_proxies: ""
  admin_allowed_networks: ""
  admin_allowlist_disable: false
  cors_extra_origins: ""
  dns_update_port: 0
  dns_update_host: ""
  disable_canonical_redirect: false
  hsm_auto_init: true
  env_vars: []
schema:
  ucm_fqdn: str?
  https_cert_file: str?
  https_key_file: str?
  https_port: port
  http_port: port
  debug: bool
  log_level: list(DEBUG|INFO|WARNING|ERROR)
  log_max_bytes: int(1024,)
  log_backups: int(0,)
  secret_key: password?
  key_encryption_key: password?
  database_url: str?
  backup_enabled: bool
  backup_retention_days: int(1,)
  behind_proxy: bool
  trusted_proxies: str?
  admin_allowed_networks: str?
  admin_allowlist_disable: bool
  cors_extra_origins: str?
  dns_update_port: int(0,65535)
  dns_update_host: str?
  disable_canonical_redirect: bool
  hsm_auto_init: bool
  env_vars:
    - name: str
      value: password?
      secret: bool?
