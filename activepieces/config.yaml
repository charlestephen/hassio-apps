# https://developers.home-assistant.io/docs/add-ons/configuration
name: Activepieces
description: >-
  No-code business automation / workflow builder (self-hosted Zapier
  alternative). Thin wrapper on the official image; runs fully standalone
  (embedded PGLite + in-memory queue) by default.
url: https://github.com/charlestephen/hassio-apps/tree/main/activepieces
version: "0.93.0-2"
stage: stable
homeassistant: "2026.6.0"
slug: activepieces
image: ghcr.io/charlestephen/hassio-addons-activepieces-{arch}
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
apparmor: true
panel_icon: mdi:puzzle
webui: http://[HOST]:[PORT:8095]/
map:
  - type: data
    read_only: false
ports:
  80/tcp: 8095
ports_description:
  80/tcp: Activepieces web UI and API
backup: cold

options:
  frontend_url: ""
  encryption_key: ""
  jwt_secret: ""
  telemetry_enabled: false
  execution_mode: UNSANDBOXED
  # Default: fully standalone, no external dependencies (embedded PGLite DB +
  # in-memory queue). Set to "postgres"/"standalone" plus the matching
  # host/port/etc. below to use this repository's PostgreSQL/Valkey apps
  # instead.
  db_type: pglite
  db_host: dd815a57-postgres
  db_port: 5432
  db_name: activepieces
  db_user: activepieces
  db_password: ""
  redis_type: memory
  redis_host: dd815a57-valkey
  redis_port: 6379
  redis_password: ""
  env_vars: []
schema:
  frontend_url: str?
  encryption_key: password?
  jwt_secret: password?
  telemetry_enabled: bool
  execution_mode: list(UNSANDBOXED|SANDBOX_CODE_ONLY)
  db_type: list(pglite|postgres)
  db_host: str?
  db_port: port
  db_name: str?
  db_user: str?
  db_password: password?
  redis_type: list(memory|standalone)
  redis_host: str?
  redis_port: port
  redis_password: password?
  env_vars:
    - name: str
      value: password?
      secret: bool?
