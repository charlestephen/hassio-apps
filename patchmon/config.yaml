# https://developers.home-assistant.io/docs/add-ons/configuration
name: "PatchMon"
version: "2.1.8"
slug: patchmon
description: >-
  Linux patch management and monitoring. Uses the PostgreSQL app and includes
  its own Redis-compatible cache.
url: https://github.com/charlestephen/hassio-apps/tree/main/patchmon
image: ghcr.io/charlestephen/hassio-addons-patchmon-{arch}
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
apparmor: true
panel_icon: mdi:update
webui: http://[HOST]:[PORT:3000]/
watchdog: tcp://[HOST]:[PORT:3000]
ports:
  3000/tcp: 3100
ports_description:
  3000/tcp: PatchMon web UI and agent API

options:
  server_url: ""
  postgres_host: ""
  postgres_port: 5432
  postgres_db: patchmon_db
  postgres_user: patchmon_user
  postgres_password: ""
  postgres_admin_user: postgres
  postgres_admin_password: ""
  trust_proxy: false
  log_level: info
  timezone: ""
  env_vars: []
schema:
  server_url: str?
  postgres_host: str?
  postgres_port: port
  postgres_db: str
  postgres_user: str
  postgres_password: password?
  postgres_admin_user: str
  postgres_admin_password: password?
  trust_proxy: bool
  log_level: list(debug|info|warn|error)
  timezone: str?
  env_vars:
    - name: str
      value: password?
      secret: bool?
