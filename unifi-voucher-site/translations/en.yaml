---
configuration:
  unifi_ip: { name: UniFi IP, description: IP address of the UniFi OS Console. }
  unifi_port: { name: UniFi port, description: Console port (usually 443 or 8443). }
  unifi_token: { name: UniFi API token, description: API key from the UniFi OS integrations tab. }
  unifi_site_id: { name: UniFi site ID, description: UniFi site identifier (default "default"). }
  unifi_ssid: { name: Guest SSID, description: Guest network SSID (used in templating and QR codes). }
  unifi_ssid_password: { name: Guest SSID password, description: WPA password for the guest network (blank for open networks). }
  auth_internal_enabled: { name: Enable internal auth, description: Toggle the built-in password login for the portal. }
  auth_internal_password: { name: Internal password, description: Login password for the voucher portal. }
  auth_internal_bearer_token: { name: Internal bearer token, description: API bearer token for programmatic access. }
  auth_oidc_enabled: { name: Enable OIDC/SSO, description: Enable OpenID Connect single sign-on. }
  auth_oidc_issuer_base_url: { name: OIDC issuer base URL, description: Provider base URL exposing the .well-known configuration. }
  auth_oidc_app_base_url: { name: OIDC app base URL, description: Public URL of this voucher site. }
  auth_oidc_client_id: { name: OIDC client ID, description: Client ID from your OIDC provider. }
  auth_oidc_client_secret: { name: OIDC client secret, description: Client secret from your OIDC provider. }
  auth_oidc_redirect_login: { name: OIDC redirect login, description: Skip the login page and redirect straight to the OIDC flow. }
  auth_oidc_restrict_visibility: { name: OIDC restrict visibility, description: Limit voucher access by email domain. }
  auth_disable: { name: Disable all auth, description: Completely disable web and API authentication (use with care). }
  voucher_types: { name: Voucher types, description: "Available voucher options: expiration,usage,upload,download,dataMB separated by ';'." }
  voucher_custom: { name: Allow custom vouchers, description: Let users define custom voucher types in the UI. }
  voucher_note_required: { name: Require voucher note, description: Require a note before creating a voucher. }
  service_web: { name: Enable web UI, description: Serve the web interface. }
  service_api: { name: Enable REST API, description: Serve the REST API. }
  printers: { name: Printers, description: "Comma-separated printer types/IPs, e.g. pdf,192.168.1.10." }
  printers_layout: { name: Printer layout, description: Print layout (full, slim_qr, or slim). }
  smtp_from: { name: SMTP from, description: Sender email address for voucher delivery. }
  smtp_host: { name: SMTP host, description: SMTP server hostname or IP. }
  smtp_port: { name: SMTP port, description: SMTP port (587 TLS / 465 SSL). }
  smtp_secure: { name: SMTP secure, description: Require SSL/TLS for SMTP. }
  smtp_username: { name: SMTP username, description: SMTP authentication username. }
  smtp_password: { name: SMTP password, description: SMTP authentication password. }
  kiosk_enabled: { name: Enable kiosk, description: Enable the self-service kiosk page. }
  kiosk_voucher_types: { name: Kiosk voucher types, description: Voucher options offered in the kiosk (same format as Voucher types). }
  kiosk_name_required: { name: Kiosk name required, description: Require a guest name before generation. }
  kiosk_timeout: { name: Kiosk timeout, description: Inactivity timeout in seconds. }
  kiosk_homepage: { name: Kiosk homepage, description: Redirect the root path to the kiosk. }
  kiosk_email: { name: Kiosk email, description: Enable email voucher delivery from the kiosk. }
  kiosk_printer: { name: Kiosk printer, description: ESC/POS printer IP for automatic printing (blank to disable). }
  bind_address: { name: Bind address, description: "IP address to bind to (0.0.0.0 or :: for IPv6)." }
  log_level: { name: Log level, description: Logging verbosity. }
  translation_default: { name: Default language, description: Default UI language code (e.g. en). }
  translation_hidden_languages: { name: Hidden languages, description: Comma-separated language codes to hide from the UI. }
  translation_debug: { name: Translation debug, description: Show translation keys instead of text. }
  task_cleanup_expired: { name: Cleanup expired, description: Automatically clean up expired vouchers. }
  task_cleanup_unused: { name: Cleanup unused, description: Automatically clean up unused vouchers. }
  task_cleanup_unused_days: { name: Cleanup unused days, description: Days before an unused voucher is removed. }
network:
  3000/tcp: Web UI (ingress used by default)
