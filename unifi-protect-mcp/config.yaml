# https://developers.home-assistant.io/docs/add-ons/configuration
name: "UniFi Protect MCP"
version: "0.12.0"
slug: unifi-protect-mcp
description: >-
  MCP server that lets AI assistants manage UniFi Protect: cameras, recordings, sensors and smart detections.
  Thin wrapper on the official image, over Streamable HTTP with a bearer token.
url: https://github.com/charlestephen/hassio-apps/tree/main/unifi-protect-mcp
homeassistant: "2026.6.0"
stage: stable
image: ghcr.io/charlestephen/hassio-addons-unifi-protect-mcp-{arch}
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
apparmor: true
panel_icon: mdi:robot-outline
watchdog: tcp://[HOST]:[PORT:3001]
ports:
  3001/tcp: 3111
ports_description:
  3001/tcp: MCP endpoint (Streamable HTTP, path /mcp)
backup: cold

options:
  unifi_host: ""
  unifi_port: 443
  unifi_api_key: ""
  unifi_username: ""
  unifi_password: ""
  verify_ssl: false
  ssl_fingerprint: ""
  http_auth_token: ""
  allowed_hosts: ""
  permission_mode: "confirm"
  read_only: false
  otel_endpoint: ""
  env_vars: []
schema:
  unifi_host: str
  unifi_port: port
  unifi_api_key: password?
  unifi_username: str?
  unifi_password: password?
  verify_ssl: bool
  ssl_fingerprint: str?
  http_auth_token: password?
  allowed_hosts: str?
  permission_mode: list(confirm|bypass)
  read_only: bool
  otel_endpoint: str?
  env_vars:
    - name: str
      value: password?
      secret: bool?
