# https://developers.home-assistant.io/docs/add-ons/configuration
name: RSS-Bridge
description: >-
  Generates Atom/RSS feeds for websites that don't provide their own. Thin
  wrapper on the official image.
url: https://github.com/charlestephen/hassio-apps/tree/main/rss-bridge
version: "2026-09-30"
stage: stable
homeassistant: "2026.6.0"
slug: rss_bridge
image: ghcr.io/charlestephen/hassio-addons-rss-bridge-{arch}
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
apparmor: true
panel_icon: mdi:rss
webui: http://[HOST]:[PORT:8086]/
map:
  - type: app_config
    read_only: false
ports:
  80/tcp: 8086
ports_description:
  80/tcp: RSS-Bridge web UI and feed endpoints
backup: cold
