# https://developers.home-assistant.io/docs/add-ons/configuration
name: "Dockhand"
version: "1.0.57-1"
slug: dockhand
description: >-
  Docker management UI for containers, Compose stacks, images and volumes, stored in the PostgreSQL app.
  Thin wrapper on the official image.
url: https://github.com/charlestephen/hassio-apps/tree/main/dockhand
homeassistant: "2026.6.0"
stage: stable
image: ghcr.io/charlestephen/hassio-addons-dockhand-{arch}
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
apparmor: true
panel_icon: mdi:docker
webui: http://[HOST]:[PORT:3000]/
watchdog: tcp://[HOST]:[PORT:3000]
# docker_api mounts the host Docker socket; Supervisor only honors this when
# Protection mode is off - see DOCS.md.
docker_api: true
ports:
  3000/tcp: 3010
ports_description:
  3000/tcp: Dockhand web UI
backup: cold

options:
  db_host: "dd815a57-postgres"
  db_port: 5432
  db_name: "dockhand"
  db_user: "dockhand"
  db_password: ""
  db_admin_user: "postgres"
  db_admin_password: ""
  origin: ""
  encryption_key: ""
  puid: 0
  pgid: 0
  export_metrics: false
  disable_local_login: false
  env_vars: []
schema:
  db_host: str
  db_port: port
  db_name: str
  db_user: str
  db_password: password
  db_admin_user: str?
  db_admin_password: password?
  origin: str?
  encryption_key: password?
  puid: int
  pgid: int
  export_metrics: bool
  disable_local_login: bool
  env_vars:
    - name: str
      value: password?
      secret: bool?
