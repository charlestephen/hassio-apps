---
# Thin wrapper: build directly on the official multi-arch image.
build_from:
  aarch64: docker.io/victoriametrics/victoria-metrics:v1.156.0
  amd64: docker.io/victoriametrics/victoria-metrics:v1.156.0
upstream_repo: "VictoriaMetrics/VictoriaMetrics"
upstream_build_from: true
upstream_build_from_prefix: v
upstream_docker_image: "victoriametrics/victoria-metrics"
upstream_tag_pattern: 'v\d+\.\d+\.\d+'
upstream_version_arg: VICTORIA_METRICS_VERSION
upstream_version_arg_prefix: v
args:
  VICTORIA_METRICS_VERSION: "v1.156.0"
