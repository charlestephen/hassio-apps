# https://developers.home-assistant.io/docs/add-ons/configuration
name: "Grafana Tempo"
version: "3.1.1-1"
slug: tempo
description: >-
  Grafana Tempo, the distributed tracing backend. Monolithic mode with local
  filesystem storage and OTLP receivers. Thin wrapper on the official image.
url: https://github.com/charlestephen/hassio-apps/tree/main/tempo
stage: stable
homeassistant: "2026.6.0"
image: ghcr.io/charlestephen/hassio-addons-tempo-{arch}
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
apparmor: true
panel_icon: mdi:chart-timeline
watchdog: http://[HOST]:[PORT:3200]/ready
map:
  - type: data
    read_only: false
  - type: app_config
    read_only: false
ports:
  3200/tcp: 3200
  4317/tcp: null
  4318/tcp: null
ports_description:
  3200/tcp: Tempo HTTP API (query, /ready, /metrics)
  4317/tcp: OTLP gRPC receiver (not published by default)
  4318/tcp: OTLP HTTP receiver (not published by default)
backup: cold

options:
  log_level: info
  retention_period: "336h"

schema:
  log_level: list(debug|info|warn|error)
  retention_period: match(^[0-9]+[smhdwy]$)

