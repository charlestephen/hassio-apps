# https://developers.home-assistant.io/docs/add-ons/configuration
name: Hawser Agent for Dockhand
version: "0.2.53"
slug: dockhand_hawser
description: >-
  Bridges Home Assistant's Docker to a Dockhand server (Standard or Edge mode)
  via the Hawser agent.
url: https://github.com/charlestephen/hassio-apps/tree/main/dockhand-hawser
homeassistant: "2026.6.0"
stage: stable
image: ghcr.io/charlestephen/hassio-addons-dockhand-hawser-{arch}
arch:
  - amd64
  - aarch64
init: false
startup: services
boot: auto
panel_icon: mdi:ferry
panel_title: Hawser
hassio_api: true
hassio_role: manager
# docker_api mounts the host Docker socket; Supervisor only honors this when
# Protection mode is off — see DOCS.md.
docker_api: true
apparmor: true
privileged:
  - SYS_ADMIN
map:
  - type: ssl
    read_only: true
  - type: share
    read_only: false
ports:
  2376/tcp: 2376
ports_description:
  2376/tcp: Standard mode Docker API port (only used when mode is "standard").
ingress: true
ingress_port: 8099
backup: cold

options:
  mode: edge
  agent_name: ""
  token: ""
  dockhand_url: ""
  port: 2376
  bind_address: "0.0.0.0"
  tls_cert: ""
  tls_key: ""
  docker_socket: /var/run/docker.sock
  stacks_dir: /data/stacks
  log_level: info
  skip_df_collection: false
schema:
  mode: list(standard|edge)
  agent_name: str?
  token: password?
  dockhand_url: str?
  port: port
  bind_address: str
  tls_cert: str?
  tls_key: str?
  docker_socket: str
  stacks_dir: str
  log_level: list(debug|info|warn|error)
  skip_df_collection: bool
