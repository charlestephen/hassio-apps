configuration:
  kafka_host:
    name: Kafka host
    description: Hostname of the Kafka app.
  kafka_port:
    name: Kafka port
    description: Kafka client port.
  clickhouse_host:
    name: ClickHouse host
    description: Hostname of the ClickHouse app.
  clickhouse_port:
    name: ClickHouse native port
    description: >-
      ClickHouse native protocol port (not the HTTP port) as seen by other
      containers.
  clickhouse_password:
    name: ClickHouse password
    description: Must match the ClickHouse app's Default user password option.
  redis_host:
    name: Valkey host
    description: Hostname of the Valkey app.
  redis_port:
    name: Valkey port
    description: Valkey port.
  snmp_community:
    name: SNMP community (v1/v2c)
    description: >-
      SNMPv1/v2c read-only community string. Ignored once SNMP v3 user is
      set. Akvorado discards a flow if it cannot resolve interface names, so
      this must match what each exporter accepts.
  snmp_v3_user:
    name: SNMP v3 user
    description: >-
      Set this to use SNMPv3 instead of v1/v2c (takes priority over SNMP
      community). Leave empty to use the community string above.
  snmp_v3_auth_protocol:
    name: SNMP v3 authentication protocol
    description: Authentication protocol for the SNMP v3 user.
  snmp_v3_auth_passphrase:
    name: SNMP v3 authentication passphrase
    description: Authentication passphrase for the SNMP v3 user.
  snmp_v3_priv_protocol:
    name: SNMP v3 privacy protocol
    description: Privacy (encryption) protocol for the SNMP v3 user.
  snmp_v3_priv_passphrase:
    name: SNMP v3 privacy passphrase
    description: Privacy (encryption) passphrase for the SNMP v3 user.
network:
  2055/udp: NetFlow v9/IPFIX flow input (inlet)
  4739/udp: IPFIX flow input (inlet)
  6343/udp: sFlow flow input (inlet)
  8083/tcp: Console web UI
