configuration:
  kafka_host:
    name: Kafka host
    description: Hostname of the Kafka app.
  kafka_port:
    name: Kafka port
    description: Kafka client port.
  clickhouse_host:
    name: ClickHouse host
    description: Hostname of the ClickHouse app.
  clickhouse_port:
    name: ClickHouse native port
    description: >-
      ClickHouse native protocol port (not the HTTP port) as seen by other
      containers.
  clickhouse_password:
    name: ClickHouse password
    description: Must match the ClickHouse app's Default user password option.
  redis_host:
    name: Valkey host
    description: Hostname of the Valkey app.
  redis_port:
    name: Valkey port
    description: Valkey port.
  snmp_community:
    name: SNMP community
    description: >-
      SNMPv1/v2c read-only community string used to resolve interface names
      on exporters. Akvorado discards a flow if it cannot resolve this, so
      it must match what each exporter accepts.
network:
  2055/udp: NetFlow v9/IPFIX flow input (inlet)
  4739/udp: IPFIX flow input (inlet)
  6343/udp: sFlow flow input (inlet)
  8083/tcp: Console web UI
