name: Akvorado
description: Akvorado collects NetFlow/IPFIX/sFlow, enriches it, stores it in ClickHouse, and visualizes it. Runs orchestrator, inlet, outlet and console together in one app, using the Kafka, ClickHouse and Valkey apps as its dependencies.
url: https://github.com/charlestephen/hassio-apps/tree/main/akvorado
version: "2026.10.1-7"
stage: stable
homeassistant: "2026.6.0"
slug: akvorado
image: ghcr.io/charlestephen/hassio-addons-akvorado-{arch}
startup: application
init: false
boot: auto
hassio_role: default
panel_icon: mdi:chart-sankey
webui: http://[HOST]:[PORT:8083]
arch:
  - aarch64
  - amd64
map:
  - type: data
    read_only: false
ports:
  2055/udp: 2055
  4739/udp: 4739
  6343/udp: 6343
  8083/tcp: 8083
ports_description:
  2055/udp: NetFlow v9/IPFIX flow input (inlet)
  4739/udp: IPFIX flow input (inlet)
  6343/udp: sFlow flow input (inlet)
  8083/tcp: Console web UI
options:
  kafka_host: dd815a57-kafka
  kafka_port: 9092
  clickhouse_host: dd815a57-clickhouse
  clickhouse_port: 9000
  clickhouse_password: ""
  redis_host: dd815a57-valkey
  redis_port: 6379
  snmp_community: public
  snmp_v3_user: ""
  snmp_v3_auth_protocol: SHA
  snmp_v3_auth_passphrase: ""
  snmp_v3_priv_protocol: AES
  snmp_v3_priv_passphrase: ""
  default_sampling_rate: 0
  wan_interface_name: ""
  geoip_account_id: ""
  geoip_license_key: ""
schema:
  kafka_host: str
  kafka_port: port
  clickhouse_host: str
  clickhouse_port: port
  clickhouse_password: password?
  redis_host: str
  redis_port: port
  snmp_community: password?
  snmp_v3_user: str?
  snmp_v3_auth_protocol: list(none|MD5|SHA|SHA224|SHA256|SHA384|SHA512)?
  snmp_v3_auth_passphrase: password?
  snmp_v3_priv_protocol: list(none|DES|AES|AES192|AES256|AES192-C|AES256-C)?
  default_sampling_rate: int(0,)
  snmp_v3_priv_passphrase: password?
  wan_interface_name: str?
  geoip_account_id: str?
  geoip_license_key: password?
