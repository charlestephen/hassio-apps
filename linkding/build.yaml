---
# Multi-stage build with a pinned versioned Linkding Alpine image and the HA
# base for s6-overlay.
build_from:
  aarch64: ghcr.io/hassio-addons/base:stable
  amd64: ghcr.io/hassio-addons/base:stable
upstream_repo: sissbruecker/linkding
upstream_version_arg: LINKDING_VERSION
args:
  LINKDING_VERSION: "1.47.0"
