# https://developers.home-assistant.io/docs/add-ons/configuration
name: "OpenObserve"
version: "1.1.2-1"
slug: openobserve
description: >-
  OpenObserve, an all-in-one observability backend for logs, metrics and
  traces with a built-in UI and OTLP ingestion. Thin wrapper on the official
  image.
url: https://github.com/charlestephen/hassio-apps/tree/main/openobserve
stage: stable
homeassistant: "2026.6.0"
image: ghcr.io/charlestephen/hassio-addons-openobserve-{arch}
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
apparmor: true
panel_icon: mdi:eye-circle
webui: http://[HOST]:[PORT:5080]/
watchdog: http://[HOST]:[PORT:5080]/healthz
map:
  - type: data
    read_only: false
  - type: app_config
    read_only: false
ports:
  5080/tcp: 5080
  5081/tcp: 5081
ports_description:
  5080/tcp: OpenObserve web UI, API and OTLP/HTTP ingestion
  5081/tcp: OTLP gRPC ingestion
backup: cold

options:
  root_email: ""
  root_password: ""
  retention_days: 30
  web_url: ""
  env_vars: []

schema:
  root_email: email
  root_password: password
  retention_days: int(1,)
  web_url: str?
  env_vars:
    - name: str
      value: password?
      secret: bool?

