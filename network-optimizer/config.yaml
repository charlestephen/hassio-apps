name: UniFi Network Optimizer
description: Ozark-Connect Network Optimizer for UniFi — Wi-Fi/channel optimization, security audits, ISP health, speed tests.
url: https://github.com/Ozark-Connect/NetworkOptimizer
version: "2.0.1-1"
slug: network-optimizer
arch:
  - amd64
  - aarch64
image: ghcr.io/charlestephen/hassio-addons-network-optimizer-{arch}
init: true
startup: services
boot: auto
panel_icon: mdi:access-point-network
host_network: true
webui: http://[HOST]:8042
ports:
  8042/tcp: 8042
ports_description:
  8042/tcp: Web UI
backup: cold
stage: experimental

# ---------------------------------------------------------------------------
# Full environment surface from the upstream docker-compose.prod.yml / .env.
# Ref: https://github.com/Ozark-Connect/NetworkOptimizer
# Empty / false values are treated as unset and fall back to upstream defaults.
# ---------------------------------------------------------------------------
options:
  timezone: "America/New_York"
  bind_localhost_only: false
  app_password: ""
  host_ip: ""
  host_name: ""
  reverse_proxied_host_name: ""
  iperf3_server_enabled: false
  openspeedtest_port: 3005
  openspeedtest_host: ""
  openspeedtest_https: false
  openspeedtest_https_port: 443
  log_level: Information
  app_log_level: Information
  demo_mode_mappings: ""

schema:
  timezone: str?
  bind_localhost_only: bool
  app_password: password?
  host_ip: str?
  host_name: str?
  reverse_proxied_host_name: str?
  iperf3_server_enabled: bool
  openspeedtest_port: int(1,65535)?
  openspeedtest_host: str?
  openspeedtest_https: bool
  openspeedtest_https_port: int(1,65535)?
  log_level: list(Trace|Debug|Information|Warning|Error|Critical|None)?
  app_log_level: list(Trace|Debug|Information|Warning|Error|Critical|None)?
  demo_mode_mappings: str?