---
# Thin wrapper: build directly on Homarr's official multi-arch image.
# Renovate tracks these per-arch lines via the shared regex manager.
build_from:
  aarch64: ghcr.io/homarr-labs/homarr:v$APP_NEW_VERSION
  amd64: ghcr.io/homarr-labs/homarr:v$APP_NEW_VERSION
upstream_repo: "homarr-labs/homarr"
upstream_build_from: true
upstream_build_from_prefix: v
upstream_version_arg: HOMARR_VERSION
args:
  HOMARR_VERSION: "$APP_NEW_VERSION"
