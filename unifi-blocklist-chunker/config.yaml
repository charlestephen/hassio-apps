# https://developers.home-assistant.io/docs/add-ons/configuration
name: "UniFi Blocklist Chunker"
version: "1.1.0"
slug: "unifi_blocklist_chunker"
description: "Merge upstream DNS/IP blocklists into UniFi-sized domain, IPv4, and IPv6 chunks"
url: "https://github.com/charlestephen/hassio-apps/tree/main/unifi-blocklist-chunker"
# Image name follows the app directory (hyphens), matching build.yml:
#   ghcr.io/<owner>/hassio-addons-<dir>-{arch}
image: "ghcr.io/charlestephen/hassio-addons-unifi-blocklist-chunker-{arch}"
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
stage: stable
panel_icon: mdi:shield-search
webui: http://[HOST]:[PORT:8080]/

# Exclusions JSON lives on the app's /data volume so removals survive restarts.
map:
  - type: data
    read_only: false

ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: "Chunk index, lists, /stats, /search, and /manage UI"

options:
  blocklist_urls:
    - "https://example.com/dns-blocklist.txt"
    - "https://example.com/ip-blocklist.txt"
  chunk_size: 100000
  refresh_interval: "6h"
  base_url: ""
  admin_token: ""
  exclusions: []
  exclusions_urls: []
schema:
  blocklist_urls:
    - url
  chunk_size: int(1,)
  refresh_interval: str
  base_url: str?
  admin_token: password?
  exclusions:
    - str
  exclusions_urls:
    - url
