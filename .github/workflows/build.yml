name: Build app images

on:
  push:
    branches: [main]
    paths:
      - '*/config.yaml'
      - '*/Dockerfile'
      - '*/build.yaml'
      - '*/rootfs/**'
      - '*/apparmor.txt'
  workflow_dispatch:
    inputs:
      addon:
        description: 'App slug(s) to build: one slug, comma-separated list, or blank = all'
        required: false

# Job-level packages:write is not always enough for first-time GHCR package
# creation on this account; grant it at workflow scope too.
permissions:
  contents: read
  packages: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      addons: ${{ steps.set.outputs.addons }}
    steps:
      # Full history so a push of several commits can be diffed against the
      # commit before it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: set
        env:
          ADDON_INPUT: ${{ github.event.inputs.addon }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          is_app() {
            [ -f "$1/config.yaml" ] && [ -f "$1/build.yaml" ]
          }

          if [ -n "${ADDON_INPUT:-}" ]; then
            # One slug or comma-separated list (track-upstream dispatches once).
            apps=()
            IFS=',' read -ra raw <<< "$ADDON_INPUT"
            for a in "${raw[@]}"; do
              a="${a//[[:space:]]/}"
              [ -z "$a" ] && continue
              if [[ ! "$a" =~ ^[a-z0-9_-]+$ ]] || ! is_app "$a"; then
                echo "Unknown app slug: $a" >&2
                exit 1
              fi
              apps+=("$a")
            done
            if [ "${#apps[@]}" -eq 0 ]; then
              echo "No valid app slugs in addon input: $ADDON_INPUT" >&2
              exit 1
            fi
            list=$(printf '%s\n' "${apps[@]}" | jq -R . | jq -sc .)
            echo "Building dispatched app(s): $list"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # Blank dispatch = intentional full rebuild of every app.
            list=$(for d in */; do is_app "${d%/}" && echo "${d%/}"; done | jq -R . | jq -sc .)
            echo "Building all apps (manual dispatch): $list"
          else
            # Push: only apps whose own tree changed in this commit.
            if [ -z "${BEFORE:-}" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              range="HEAD~1..HEAD"
            else
              range="${BEFORE}..${SHA}"
            fi
            echo "Detecting changed apps in $range"
            mapfile -t dirs < <(
              git diff --name-only "$range" \
                | awk -F/ 'NF>=2 {print $1}' \
                | sort -u
            )
            apps=()
            for d in "${dirs[@]+"${dirs[@]}"}"; do
              if is_app "$d"; then
                apps+=("$d")
              fi
            done
            if [ "${#apps[@]}" -eq 0 ]; then
              list='[]'
              echo "No app directories changed; skipping builds"
            else
              list=$(printf '%s\n' "${apps[@]}" | jq -R . | jq -sc .)
              echo "Building changed apps: $list"
            fi
          fi
          echo "addons=${list}" >> "$GITHUB_OUTPUT"

  build:
    needs: discover
    if: needs.discover.outputs.addons != '[]'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Capped below GitHub's per-account concurrent-job limit: this matrix
      # is apps x 2 arches, which at ~14 apps (28 jobs) was hitting that
      # limit and causing the whole run to conclude "startup_failure" even
      # though most jobs had actually run.
      max-parallel: 6
      matrix:
        addon: ${{ fromJson(needs.discover.outputs.addons) }}
        arch: [amd64, aarch64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble build metadata
        id: meta
        env:
          A: ${{ matrix.addon }}
          ARCH: ${{ matrix.arch }}
        run: |
          case "$ARCH" in
            amd64)   echo "platform=linux/amd64" >> "$GITHUB_OUTPUT" ;;
            aarch64) echo "platform=linux/arm64" >> "$GITHUB_OUTPUT" ;;
          esac
          VERSION=$(grep '^version:' "$A/config.yaml" | sed 's/^version: *//; s/"//g')
          if [[ "$VERSION" == *'$'* ]]; then
            echo "Refusing to build ${A}: config.yaml version is unsubstituted (${VERSION})" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          # Parsed with PyYAML instead of grep/sed: the previous grep/sed
          # truncated at the LAST colon in the line, mangling any BUILD_FROM
          # value that is itself an image:tag (e.g. "codeberg.org/forgejo/forgejo:15.0.4"
          # became just "15.0.4"), which broke every app's build.
          BUILD_FROM=$(python3 -c "
          import sys, yaml
          d = yaml.safe_load(open(sys.argv[1])) or {}
          print((d.get('build_from') or {}).get(sys.argv[2], ''))
          " "$A/build.yaml" "$ARCH")
          echo "build_from=${BUILD_FROM}" >> "$GITHUB_OUTPUT"
          # Pass through every arg declared in the app's build.yaml.
          python3 - "$A/build.yaml" > extra_build_args <<'PY'
          import sys, yaml
          d = yaml.safe_load(open(sys.argv[1])) or {}
          for k, v in (d.get("args") or {}).items():
              print(f"--build-arg={k}={v}")
          PY

      - name: Build and push
        env:
          A: ${{ matrix.addon }}
          ARCH: ${{ matrix.arch }}
          OWNER: ${{ github.repository_owner }}
          REPOSITORY: ${{ github.repository }}
          PLATFORM: ${{ steps.meta.outputs.platform }}
          BUILD_FROM: ${{ steps.meta.outputs.build_from }}
          VERSION: ${{ steps.meta.outputs.version }}
          DATE: ${{ steps.meta.outputs.date }}
        run: |
          # Prefer the image: template from config.yaml so apps can use
          # repo-scoped GHCR names (ghcr.io/owner/repo/app-arch). Flat
          # user packages (hassio-addons-*) work for existing apps; new
          # package creates have been denied write_package on this account.
          IMG=$(grep -E '^image:[[:space:]]*' "$A/config.yaml" | head -1 \
            | sed -E 's/^image:[[:space:]]*//; s/[\"'\'']//g; s/[[:space:]]+$//')
          IMG="${IMG//\{arch\}/${ARCH}}"
          if [ -z "$IMG" ]; then
            IMG="ghcr.io/${OWNER}/hassio-addons-${A}-${ARCH}"
          fi
          echo "Pushing ${IMG}:${VERSION}"
          echo "IMG=${IMG}" >> "$GITHUB_ENV"
          mapfile -t EXTRA < extra_build_args
          # HA Supervisor / older Docker Accept headers do not pull OCI media
          # types from GHCR (classic Docker schema2 Accept → 404). Buildx
          # defaults to OCI manifests even with --provenance=false; that only
          # removes the attestation *index* wrapper. Match official
          # hassio-addons images: Docker schema2 + gzip layers, no attestations.
          docker buildx build \
            --platform "${PLATFORM}" \
            --provenance=false \
            --sbom=false \
            --build-arg BUILD_ARCH="${ARCH}" \
            --build-arg BUILD_FROM="${BUILD_FROM}" \
            --build-arg BUILD_VERSION="${VERSION}" \
            --build-arg BUILD_NAME="${A}" \
            --build-arg BUILD_DESCRIPTION="${A} Home Assistant app" \
            --build-arg BUILD_REPOSITORY="${REPOSITORY}" \
            --build-arg BUILD_REF="${GITHUB_SHA}" \
            --build-arg BUILD_DATE="${DATE}" \
            "${EXTRA[@]}" \
            --output "type=image,\"name=${IMG}:${VERSION},${IMG}:latest\",push=true,oci-mediatypes=false,compression=gzip,force-compression=true" \
            "$A"

      # Prove the image can be pulled the way the Supervisor pulls it: anonymously, with a classic Docker Accept
      # header as well as an OCI one, and with the architecture the app declares. A private package, a missing
      # tag or a wrong-architecture image fails here instead of on a Home Assistant host.
      - name: Verify the image can be pulled
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          repo="${IMG#ghcr.io/}"
          want="amd64"; [ "$ARCH" = "aarch64" ] && want="arm64"
          schema2="application/vnd.docker.distribution.manifest.v2+json"
          oci="application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, ${schema2}"

          fetch() { # url accept -> body on stdout, retrying while GHCR catches up
            for attempt in 1 2 3 4; do
              if out=$(curl -fsSL -H "Authorization: Bearer ${token}" -H "Accept: $2" "$1"); then
                printf '%s' "$out"; return 0
              fi
              sleep $((attempt * 5))
            done
            return 1
          }

          token=$(curl -fsS "https://ghcr.io/token?scope=repository:${repo}:pull" | jq -r '.token // empty')
          if [ -z "$token" ]; then
            echo "::error::No anonymous pull token for ${IMG}. The package is probably private; make it public." >&2
            exit 1
          fi
          manifest=$(fetch "https://ghcr.io/v2/${repo}/manifests/${VERSION}" "$schema2") \
            || { echo "::error::${IMG}:${VERSION} cannot be fetched with a classic Docker Accept header" >&2; exit 1; }
          fetch "https://ghcr.io/v2/${repo}/manifests/${VERSION}" "$oci" > /dev/null \
            || { echo "::error::${IMG}:${VERSION} cannot be fetched with an OCI Accept header" >&2; exit 1; }
          config=$(printf '%s' "$manifest" | jq -r '.config.digest')
          got=$(fetch "https://ghcr.io/v2/${repo}/blobs/${config}" "*/*" | jq -r '.architecture')
          if [ "$got" != "$want" ]; then
            echo "::error::${IMG}:${VERSION} is built for ${got}, expected ${want}" >&2
            exit 1
          fi
          echo "${IMG}:${VERSION} pulls with both Accept headers and is ${got}"
