name: Build app images

on:
  push:
    branches: [main]
    paths:
      - '*/config.yaml'
      - '*/Dockerfile'
      - '*/build.yaml'
      - '*/rootfs/**'
  workflow_dispatch:
    inputs:
      addon:
        description: 'Single app slug to build (blank = all)'
        required: false

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      addons: ${{ steps.set.outputs.addons }}
    steps:
      - uses: actions/checkout@v7
      - id: set
        env:
          ADDON_INPUT: ${{ github.event.inputs.addon }}
        run: |
          if [ -n "$ADDON_INPUT" ]; then
            if [[ ! "$ADDON_INPUT" =~ ^[a-z0-9_-]+$ ]] || [ ! -f "$ADDON_INPUT/config.yaml" ] || [ ! -f "$ADDON_INPUT/build.yaml" ]; then
              echo "Unknown app slug: $ADDON_INPUT" >&2
              exit 1
            fi
            jq -rn --arg a "$ADDON_INPUT" '"addons=" + ([$a] | tojson)' >> "$GITHUB_OUTPUT"
          else
            list=$(for d in */; do [ -f "${d}config.yaml" ] && [ -f "${d}build.yaml" ] && echo "${d%/}"; done | jq -R . | jq -sc .)
            echo "addons=${list}" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: discover
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Capped below GitHub's per-account concurrent-job limit: this matrix
      # is apps x 2 arches, which at ~14 apps (28 jobs) was hitting that
      # limit and causing the whole run to conclude "startup_failure" even
      # though most jobs had actually run.
      max-parallel: 6
      matrix:
        addon: ${{ fromJson(needs.discover.outputs.addons) }}
        arch: [amd64, aarch64]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble build metadata
        id: meta
        env:
          A: ${{ matrix.addon }}
          ARCH: ${{ matrix.arch }}
        run: |
          case "$ARCH" in
            amd64)   echo "platform=linux/amd64" >> "$GITHUB_OUTPUT" ;;
            aarch64) echo "platform=linux/arm64" >> "$GITHUB_OUTPUT" ;;
          esac
          VERSION=$(grep '^version:' "$A/config.yaml" | sed 's/^version: *//; s/"//g')
          if [[ "$VERSION" == *'$'* ]]; then
            echo "Refusing to build ${A}: config.yaml version is unsubstituted (${VERSION})" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          # Parsed with PyYAML instead of grep/sed: the previous grep/sed
          # truncated at the LAST colon in the line, mangling any BUILD_FROM
          # value that is itself an image:tag (e.g. "codeberg.org/forgejo/forgejo:15.0.4"
          # became just "15.0.4"), which broke every app's build.
          BUILD_FROM=$(python3 -c "
          import sys, yaml
          d = yaml.safe_load(open(sys.argv[1])) or {}
          print((d.get('build_from') or {}).get(sys.argv[2], ''))
          " "$A/build.yaml" "$ARCH")
          echo "build_from=${BUILD_FROM}" >> "$GITHUB_OUTPUT"
          # Pass through every arg declared in the app's build.yaml.
          python3 - "$A/build.yaml" > extra_build_args <<'PY'
          import sys, yaml
          d = yaml.safe_load(open(sys.argv[1])) or {}
          for k, v in (d.get("args") or {}).items():
              print(f"--build-arg={k}={v}")
          PY

      - name: Build and push
        env:
          A: ${{ matrix.addon }}
          ARCH: ${{ matrix.arch }}
          OWNER: ${{ github.repository_owner }}
          REPOSITORY: ${{ github.repository }}
          PLATFORM: ${{ steps.meta.outputs.platform }}
          BUILD_FROM: ${{ steps.meta.outputs.build_from }}
          VERSION: ${{ steps.meta.outputs.version }}
          DATE: ${{ steps.meta.outputs.date }}
        run: |
          IMG="ghcr.io/${OWNER}/hassio-addons-${A}-${ARCH}"
          mapfile -t EXTRA < extra_build_args
          docker buildx build \
            --platform "${PLATFORM}" \
            --build-arg BUILD_ARCH="${ARCH}" \
            --build-arg BUILD_FROM="${BUILD_FROM}" \
            --build-arg BUILD_VERSION="${VERSION}" \
            --build-arg BUILD_NAME="${A}" \
            --build-arg BUILD_DESCRIPTION="${A} Home Assistant app" \
            --build-arg BUILD_REPOSITORY="${REPOSITORY}" \
            --build-arg BUILD_REF="${GITHUB_SHA}" \
            --build-arg BUILD_DATE="${DATE}" \
            "${EXTRA[@]}" \
            -t "${IMG}:${VERSION}" \
            -t "${IMG}:latest" \
            --push \
            "$A"
