name: Dockerfile lint

on:
  push:
    branches: [main]
    paths:
      - '**/Dockerfile'
  pull_request:
    paths:
      - '**/Dockerfile'
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      dockerfiles: ${{ steps.set.outputs.dockerfiles }}
    steps:
      - uses: actions/checkout@v4
      - id: set
        run: |
          list=$(find . -maxdepth 2 -name Dockerfile | sed 's#^\./##' | jq -R . | jq -sc .)
          echo "dockerfiles=${list}" >> "$GITHUB_OUTPUT"

  lint:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dockerfile: ${{ fromJson(needs.discover.outputs.dockerfiles) }}
    steps:
      - uses: actions/checkout@v4
      - name: Hadolint ${{ matrix.dockerfile }}
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
          # DL3006/DL3018 (pin base image / apk versions) are noisy here:
          # most of these Dockerfiles pin via ARG build args instead of a
          # literal FROM tag, and Alpine apk packages are intentionally
          # unpinned to track the base image's own security patches.
          ignore: DL3006,DL3018
          failure-threshold: warning
