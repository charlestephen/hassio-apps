name: Slack

on:
  workflow_run:
    workflows:
      - "Build app images"
      - "CodeQL Advanced"
      - "Dockerfile lint"
      - "Check Upstream and Auto-Update Apps"
      - "Container image scan"
    types:
      - completed

permissions:
  actions: read

jobs:
  notify:
    # Pull request results already show on the PR, so only main-branch runs post.
    if: >-
      github.event.workflow_run.event != 'pull_request' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Post to Slack
        env:
          GH_TOKEN: ${{ github.token }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          STATUS: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "Slack webhook is not available for this run"
            exit 0
          fi
          if [ "$STATUS" = "success" ]; then
            previous=$(gh api "repos/$REPO/actions/workflows/$WORKFLOW_ID/runs?branch=$BRANCH&status=completed&per_page=20" \
              --jq "[.workflow_runs[] | select(.id != $RUN_ID and (.conclusion == \"success\" or .conclusion == \"failure\"))][0].conclusion // \"\"")
            if [ "$previous" != "failure" ]; then
              echo "Success after $previous; not posting"
              exit 0
            fi
            STATUS="recovered"
          fi
          text=$(printf '*%s* `%s` · %s (`%s`)\n%s' "$STATUS" "$REPO" "$WORKFLOW" "$BRANCH" "$URL")
          payload=$(jq -n --arg text "$text" '{text:$text}')
          curl --fail --silent --show-error \
            --proto '=https' --tlsv1.2 \
            -H 'Content-Type: application/json' \
            -d "$payload" \
            "$SLACK_WEBHOOK_URL" \
            -o /dev/null
