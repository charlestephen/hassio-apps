name: Slack

on:
  workflow_run:
    # High-signal only. CodeQL / Hadolint stay in the Actions UI; Trivy is
    # exit-code 0 for CVEs so Slack failures there are mostly infra flakes and
    # pile up after every Build. Track Upstream → Build is the cascade that
    # still needs a page when something real breaks.
    workflows:
      - "Build app images"
      - "Check Upstream and Auto-Update Apps"
    types:
      - completed

permissions:
  actions: read

jobs:
  notify:
    # Pull request results already show on the PR, so only main-branch runs post.
    # startup_failure used to be silent (concurrency storms); treat like failure.
    if: >-
      github.event.workflow_run.event != 'pull_request' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      (github.event.workflow_run.conclusion == 'success' ||
       github.event.workflow_run.conclusion == 'failure' ||
       github.event.workflow_run.conclusion == 'startup_failure')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Post to Slack
        env:
          GH_TOKEN: ${{ github.token }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          STATUS: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          URL: ${{ github.event.workflow_run.html_url }}
          # Skip repeat failure pages for the same workflow while it stays red.
          COOLDOWN_SECONDS: "3600"
        run: |
          set -euo pipefail
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "Slack webhook is not available for this run"
            exit 0
          fi

          if [ "$STATUS" = "startup_failure" ]; then
            STATUS="failure"
          fi

          prior=$(gh api "repos/$REPO/actions/workflows/$WORKFLOW_ID/runs?branch=$BRANCH&status=completed&per_page=20" \
            --jq "[.workflow_runs[] | select(.id != ($RUN_ID | tonumber) and (.conclusion == \"success\" or .conclusion == \"failure\" or .conclusion == \"startup_failure\"))][0] // null")

          if [ "$STATUS" = "success" ]; then
            previous=$(printf '%s' "$prior" | jq -r 'if . == null then "" else .conclusion end')
            if [ "$previous" != "failure" ] && [ "$previous" != "startup_failure" ]; then
              echo "Success after ${previous:-none}; not posting"
              exit 0
            fi
            STATUS="recovered"
          else
            # Ongoing outage: immediately prior completed run was also a failure
            # within the cooldown → skip. After recovery, prior is success so the
            # next failure pages again.
            skip=$(printf '%s' "$prior" | jq -r --argjson cool "$COOLDOWN_SECONDS" '
              if . == null then
                "no"
              elif (.conclusion != "failure" and .conclusion != "startup_failure") then
                "no"
              else
                (now - (.updated_at | fromdateiso8601)) as $age
                | if $age < $cool then "yes" else "no" end
              end
            ')
            if [ "$skip" = "yes" ]; then
              echo "Failure within ${COOLDOWN_SECONDS}s of prior failure; not posting"
              exit 0
            fi
          fi

          if [ "$STATUS" = "recovered" ]; then
            reason="back to green"
          else
            reason=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" --paginate \
              --jq '[.jobs[] | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out" or .conclusion == "startup_failure") | .name] | .[0:8] | join(", ")' \
              || true)
            if [ -z "$reason" ]; then
              reason="no failed job names (check run logs)"
            fi
          fi

          text=$(printf '*%s* `%s` · %s (`%s`, %s)\n%s\n%s' \
            "$STATUS" "$REPO" "$WORKFLOW" "$BRANCH" "$RUN_EVENT" "$reason" "$URL")
          payload=$(jq -n --arg text "$text" '{text:$text}')
          curl --fail --silent --show-error \
            --proto '=https' --tlsv1.2 \
            -H 'Content-Type: application/json' \
            -d "$payload" \
            "$SLACK_WEBHOOK_URL" \
            -o /dev/null
          echo "Posted to Slack"
