name: Container image scan

on:
  workflow_run:
    workflows: ["Build app images"]
    types: [completed]
  schedule:
    - cron: "0 7 * * 1"  # weekly, catches new CVEs in images that haven't rebuilt
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  discover:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name != 'workflow_run' }}
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.set.outputs.apps }}
    steps:
      - uses: actions/checkout@v7
      - id: set
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          all_apps() {
            for d in */; do
              [ -f "${d}config.yaml" ] && [ -f "${d}build.yaml" ] && echo "${d%/}"
            done
          }

          if [ "$EVENT_NAME" = "workflow_run" ]; then
            # Only apps that actually built in the triggering run. Full-fleet
            # scans after every single-app rebuild created ~27 check jobs and
            # a matching Actions notification storm; weekly covers the rest.
            mapfile -t built < <(
              gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" --paginate \
                --jq '[.jobs[].name | capture("^build \\((?<a>[^,]+),") | .a] | unique | .[]'
            )
            apps=()
            for a in "${built[@]+"${built[@]}"}"; do
              if [ -f "$a/config.yaml" ] && [ -f "$a/build.yaml" ]; then
                apps+=("$a")
              fi
            done
            if [ "${#apps[@]}" -eq 0 ]; then
              list='[]'
              echo "No build matrix jobs in run $RUN_ID; skipping scan"
            else
              list=$(printf '%s\n' "${apps[@]}" | jq -R . | jq -sc .)
              echo "Scanning apps from build run $RUN_ID: $list"
            fi
          else
            list=$(all_apps | jq -R . | jq -sc .)
            echo "Full-fleet scan ($EVENT_NAME): $list"
          fi
          echo "apps=${list}" >> "$GITHUB_OUTPUT"

  scan:
    needs: discover
    if: needs.discover.outputs.apps != '[]' && needs.discover.outputs.apps != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.discover.outputs.apps) }}
    steps:
      - name: Scan ghcr.io/${{ github.repository_owner }}/hassio-addons-${{ matrix.app }}-amd64
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/hassio-addons-${{ matrix.app }}-amd64:latest
          format: sarif
          output: trivy-${{ matrix.app }}.sarif
          severity: CRITICAL,HIGH
          exit-code: 0
          # Results stay in this job log. Uploading SARIF opens a code-scanning
          # alert per upstream CVE, and GitHub reopens dismissed alerts on the next scan.
