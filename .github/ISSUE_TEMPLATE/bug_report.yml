name: Bug report
description: An app fails to install, start or behave as documented
labels: [bug]
body:
  - type: input
    id: app
    attributes:
      label: App
      description: Name and version shown in Home Assistant, for example `OTLP Collector 0.165.0-4`.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Home Assistant and hardware
      description: Core and Supervisor versions, and the architecture (aarch64 or amd64).
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Where does it fail?
      options:
        - Installing or downloading the app
        - Starting the app
        - While running
        - Updating the app
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The app log, and for install problems the Supervisor log (Settings, System, Logs, Supervisor). Remove secrets.
      render: text
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: What you expected and what happened
    validations:
      required: true
